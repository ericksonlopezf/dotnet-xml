name: Repository Compliance & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  compliance-audit:
    name: Compliance & Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run Architecture & Governance Compliance Verifier
        shell: pwsh
        run: ./scripts/verify-compliance.ps1

      - name: Restore Dependencies
        run: dotnet restore EricksonLopez.Xml.slnx

      - name: Build with Strict Diagnostics (TreatWarningsAsErrors)
        run: dotnet build EricksonLopez.Xml.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test EricksonLopez.Xml.slnx --no-build --configuration Release --verbosity normal

      - name: Validate NuGet Packaging
        run: dotnet pack src/EricksonLopez.Xml.Validation/EricksonLopez.Xml.Validation.csproj --no-build --configuration Release -o artifacts/
