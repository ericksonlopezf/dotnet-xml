name: Publish to NuGet

# ─── Triggers ─────────────────────────────────────────────────────────────────
# 1. Automatic: Triggered by pushing a 'v*.*.*' tag or Release Please merge.
# 2. Manual: Via workflow_dispatch with optional explicit version string.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0 — without 'v' prefix)"
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ─── Job 1: Verify Stryker Mutation Quality Gate on main ────────────────────
  mutation-gate-check:
    name: Verify Mutation Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
      actions: read
    outputs:
      needs_stryker: ${{ steps.check.outputs.needs_stryker }}
      can_proceed: ${{ steps.check.outputs.can_proceed }}
      evaluated_commit: ${{ steps.check.outputs.evaluated_commit }}
      mutation_score: ${{ steps.check.outputs.mutation_score }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Evaluate Mutation Quality Gate on main
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const verifyMutationGate = require('./scripts/verify-mutation-gate.js');
            await verifyMutationGate({ github, context, core });

  # ─── Job 2: Conditional Stryker Execution if needed ────────────────────────
  stryker-gate:
    name: Run Stryker Mutation Gate (Conditional)
    needs: mutation-gate-check
    if: needs.mutation-gate-check.outputs.needs_stryker == 'true'
    permissions:
      contents: write
      statuses: write
      actions: read
    uses: ./.github/workflows/mutation-testing.yml
    with:
      run-all: true

  # ─── Job 3: Publish to NuGet (Strict Quality Gate Required) ────────────────
  publish:
    name: Package & Publish to NuGet
    needs: [mutation-gate-check, stryker-gate]
    if: |
      always() &&
      (needs.mutation-gate-check.result == 'success') &&
      (
        (needs.mutation-gate-check.outputs.needs_stryker == 'false' && needs.mutation-gate-check.outputs.can_proceed == 'true') ||
        (needs.mutation-gate-check.outputs.needs_stryker == 'true' && needs.stryker-gate.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # Required for Sigstore OIDC attestation & NuGet login
      contents: write        # Required for GitHub Release creation
      attestations: write    # Required for actions/attest-build-provenance
      statuses: read
      actions: read
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # ─── Resolve version ────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from workflow_dispatch input: $INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from git tag: $VERSION"
          else
            VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo "1.0.0")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from Directory.Build.props: $VERSION"
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore Strong Name Key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Restore Dependencies
        run: dotnet restore EricksonLopez.Xml.slnx

      - name: Build Solution (Release)
        run: dotnet build EricksonLopez.Xml.slnx --no-restore --configuration Release

      # ─── Full test suite with coverage before publish ───────────────────────
      - name: Run tests before publish
        run: |
          dotnet test EricksonLopez.Xml.slnx \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=publish-test-results.trx" \
            --results-directory ./test-results \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Upload coverage to Codecov (publish gate)
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/coverage.opencover.xml"
          fail_ci_if_error: false
          flags: publish-gate
          name: codecov-publish

      # ─── Pack NuGet Package ────────────────────────────────────────────────
      - name: Pack NuGet Package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          dotnet pack src/EricksonLopez.Xml.Validation/EricksonLopez.Xml.Validation.csproj \
            --no-build \
            --configuration Release \
            --output ./artifacts \
            -p:VersionPrefix=$VERSION \
            -p:TreatWarningsAsErrors=true

      # ─── Sigstore Provenance Attestation ───────────────────────────────────
      - name: Attest Build Provenance (Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "./artifacts/*.nupkg"

      # ─── Publish to NuGet.org via OIDC ─────────────────────────────────────
      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ericksonlopezf

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # ─── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: false
          body: |
            ## Ecosystem Packages in this release

            | Package | Version |
            |---------|---------|
            | `EricksonLopez.Xml.Validation` | `${{ steps.version.outputs.VERSION }}` |

            ---

            For detailed changes, see [CHANGELOG.md](https://github.com/ericksonlopezf/dotnet-xml/blob/${{ github.ref_name }}/CHANGELOG.md).
          files: ./artifacts/*.nupkg
          draft: false
